name: React Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          hostname
          whoami
          docker --version
          docker compose version

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/react-app:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest \
            .

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/react-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

      - name: Deploy to destination server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i /tmp/deploy_key \
            "$EC2_USER@$EC2_HOST" << 'EOF'

            cd /opt/react-app

            docker pull saratho56/react-app:latest

            docker compose down

            docker compose up -d

            docker compose ps

          EOF

          rm -f /tmp/deploy_key
