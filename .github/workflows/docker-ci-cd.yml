name: React Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-test-scan-push:
    runs-on: self-hosted

    steps:

      # 1. Checkout GitHub code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Check environment
      - name: Check environment
        run: |
          echo "Hostname:"
          hostname
          echo "User:"
          whoami
          echo "Docker:"
          docker --version
          echo "Docker Compose:"
          docker compose version
          echo "Node:"
          node --version
          echo "NPM:"
          npm --version

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          npm install

      # 4. Run tests
      - name: Run tests
        run: |
          CI=true npm test -- --watchAll=false

      # 5. SonarQube scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 6. Docker login to Nexus
      - name: Login to Nexus
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login \
            ${{ secrets.NEXUS_URL }} \
            -u "${{ secrets.NEXUS_USERNAME }}" \
            --password-stdin

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.NEXUS_URL }}/react-app:${{ github.sha }} \
            -t ${{ secrets.NEXUS_URL }}/react-app:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/react-app:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest \
            .

      # 8. Push Docker image to Nexus
      - name: Push image to Nexus
        run: |
          docker push ${{ secrets.NEXUS_URL }}/react-app:${{ github.sha }}
          docker push ${{ secrets.NEXUS_URL }}/react-app:latest

      # 9. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      # 10. Push Docker image to Docker Hub
      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/react-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

      # 11. Logout
      - name: Docker logout
        run: |
          docker logout ${{ secrets.NEXUS_URL }}
          docker logout
